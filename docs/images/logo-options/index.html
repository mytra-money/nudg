<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Nudg logo options</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; padding: 32px; color: #1f272e; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #5b6570; }
    .row { display: flex; gap: 24px; flex-wrap: wrap; }
    figure { margin: 0; background: white; border-radius: 16px; padding: 16px; width: 280px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    img { width: 100%; height: auto; border-radius: 12px; display: block; }
    figcaption { margin-top: 12px; font-weight: 600; }
    small { display: block; font-weight: 400; color: #5b6570; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Nudg logo options</h1>
  <p>Symbol only. Pick one and say which number to use as the Desk icon.</p>
  <div class="row">
    <figure>
      <img src="01-forward-bubble.jpg" alt="Forward bubble logo" />
      <figcaption>1. Forward bubble<small>A conversation nudged ahead</small></figcaption>
    </figure>
    <figure>
      <img src="02-nudge-mark.jpg" alt="Nudge mark logo" />
      <figcaption>2. Nudge mark<small>A push that moves something forward</small></figcaption>
    </figure>
    <figure>
      <img src="03-shared-inbox.jpg" alt="Shared inbox logo" />
      <figcaption>3. Shared inbox<small>A team thread heading forward</small></figcaption>
    </figure>
  </div>
</body>
</html>
