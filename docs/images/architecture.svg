<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#128C7E"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="520" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#0F172A">
    NUDG Dual-Mode Decoupled Architecture
  </text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#64748B">
    Supports both native Self-Hosted Frappe instances and standalone multi-tenant SaaS / Third-Party CRM modes.
  </text>

  <!-- Level 1: Frontend SPA -->
  <g transform="translate(60, 100)" filter="url(#boxShadow)">
    <rect width="980" height="60" rx="10" fill="#075E54" />
    <text x="490" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      NUDG Single Page App (Vue 3 + Vite + Tailwind + Frappe UI)
    </text>
    <text x="490" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#A7F3D0" text-anchor="middle">
      /nudg • Multi-Agent Team Inbox • Broadcast Campaigns • Automations • Catalog Store • Desk Workspace
    </text>
  </g>

  <!-- Connector Line 1 -->
  <line x1="550" y1="160" x2="550" y2="195" stroke="#128C7E" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Level 2: Unified API & Automation Engine -->
  <g transform="translate(60, 200)" filter="url(#boxShadow)">
    <rect width="980" height="70" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="490" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">
      Unified Desk API &amp; Rules Engine Layer
    </text>
    <text x="490" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">
      DeskMessageRepository • DeskContactRepository • Keyword Automations • Collision Presence • Round-Robin Routing
    </text>
  </g>

  <!-- Connector Lines Split -->
  <path d="M 320 270 L 320 325" stroke="#128C7E" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M 780 270 L 780 325" stroke="#128C7E" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Branch Left: Self-Hosted Mode -->
  <g transform="translate(60, 330)" filter="url(#boxShadow)">
    <rect width="460" height="150" rx="10" fill="#FFFFFF" stroke="#128C7E" stroke-width="2"/>
    <rect x="0" y="0" width="460" height="34" rx="10" fill="#E6FFFA"/>
    <text x="230" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">
      MODE 1: Self-Hosted Frappe Integration
    </text>

    <text x="24" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0F172A">
      SelfHostedFrappeConnector
    </text>
    <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">
      • Native adapter delegating to official `frappe/whatsapp`
    </text>
    <text x="24" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">
      • Reuses local `WA Account`, `WA Message`, `WA Profile`
    </text>
    <text x="24" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">
      • Zero extra infrastructure needed on Frappe sites
    </text>
    <text x="24" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#047857">
      Target: Existing Frappe / ERPNext businesses
    </text>
  </g>

  <!-- Branch Right: SaaS / Third-Party Mode -->
  <g transform="translate(580, 330)" filter="url(#boxShadow)">
    <rect width="460" height="150" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <rect x="0" y="0" width="460" height="34" rx="10" fill="#F0F9FF"/>
    <text x="230" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0369A1" text-anchor="middle">
      MODE 2: Standalone SaaS / Direct Cloud API
    </text>

    <text x="24" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0F172A">
      DirectMetaCloudApiConnector &amp; Desk Webhook
    </text>
    <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">
      • Zero dependency on local `frappe_whatsapp`
    </text>
    <text x="24" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">
      • Direct Meta Graph API v18.0+ client (Auto-retry &amp; backoff)
    </text>
    <text x="24" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">
      • Dedicated HMAC-SHA256 verified webhook receiver
    </text>
    <text x="24" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0284C7">
      Target: Multi-tenant SaaS &amp; Commercial Alternative
    </text>
  </g>
</svg>
