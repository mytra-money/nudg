<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="100%" height="100%">
  <rect width="1100" height="300" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0F172A">How the bot chooses a reply</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="650" text-anchor="middle">
    <rect x="40" y="80" width="170" height="64" rx="10" fill="#075E54"/>
    <text x="125" y="117" fill="#FFFFFF">Inbound message</text>
    <rect x="250" y="80" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="335" y="108" fill="#0F172A">Business hours?</text>
    <text x="335" y="128" font-size="11" font-weight="500" fill="#64748B">else the away text</text>
    <rect x="460" y="80" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="545" y="117" fill="#0F172A">Keyword</text>
    <rect x="670" y="80" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="755" y="117" fill="#0F172A">Flow</text>
    <rect x="880" y="80" width="180" height="64" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="970" y="108" fill="#0F172A">AI or default</text>
    <text x="970" y="128" font-size="11" font-weight="500" fill="#64748B">when nothing else matches</text>
  </g>
  <g stroke="#128C7E" stroke-width="2.5" fill="#128C7E">
    <path d="M210 112 H238"/><path d="M238 112 l-8 -5 v10 z"/>
    <path d="M420 112 H448"/><path d="M448 112 l-8 -5 v10 z"/>
    <path d="M630 112 H658"/><path d="M658 112 l-8 -5 v10 z"/>
    <path d="M840 112 H868"/><path d="M868 112 l-8 -5 v10 z"/>
  </g>
  <text x="40" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#334155">A handoff to an agent pauses the bot for that phone number. Other numbers on the same account keep the bot.</text>
  <text x="40" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#334155">The bot belongs to one WhatsApp account. Pick the account at the top of Automation before you edit.</text>
  <text x="40" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#334155">Excluded numbers never get an automated reply.</text>
</svg>
