      <stop offset="0%" stop-color="#075E54" />
      <stop offset="50%" stop-color="#128C7E" />
      <stop offset="100%" stop-color="#25D366" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
