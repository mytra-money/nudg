<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%">
  <rect width="1100" height="420" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Nudg topics</text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748B">Same shape as a docs.frappe.io app: a setup guide, then one group per area of the product.</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="650">
    <rect x="40" y="96" width="240" height="64" rx="10" fill="#075E54"/>
    <text x="160" y="133" fill="#FFFFFF" text-anchor="middle">Setup Guide</text>
    <rect x="300" y="96" width="240" height="64" rx="10" fill="#0F766E"/>
    <text x="420" y="133" fill="#FFFFFF" text-anchor="middle">Getting Started</text>
    <rect x="560" y="96" width="240" height="64" rx="10" fill="#115E59"/>
    <text x="680" y="133" fill="#FFFFFF" text-anchor="middle">Conversations</text>
    <rect x="820" y="96" width="240" height="64" rx="10" fill="#134E4A"/>
    <text x="940" y="133" fill="#FFFFFF" text-anchor="middle">Template Studio</text>
    <rect x="40" y="184" width="240" height="64" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="160" y="221" fill="#0F172A" text-anchor="middle">Marketing</text>
    <rect x="300" y="184" width="240" height="64" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="420" y="221" fill="#0F172A" text-anchor="middle">Catalogs</text>
    <rect x="560" y="184" width="240" height="64" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="680" y="221" fill="#0F172A" text-anchor="middle">Automation</text>
    <rect x="820" y="184" width="240" height="64" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="940" y="221" fill="#0F172A" text-anchor="middle">Analytics</text>
    <rect x="40" y="272" width="240" height="64" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="160" y="309" fill="#0F172A" text-anchor="middle">Settings</text>
    <rect x="300" y="272" width="240" height="64" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="420" y="309" fill="#0F172A" text-anchor="middle">Integrations</text>
    <rect x="560" y="272" width="500" height="64" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="810" y="309" fill="#0F172A" text-anchor="middle">Help</text>
  </g>
  <text x="40" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748B">Each group is a folder under docs/. Pages inside the folder are the topics in the wiki sidebar.</text>
</svg>
