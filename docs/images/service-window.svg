<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="100%">
  <rect width="1100" height="280" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0F172A">The 24-hour service window</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="40" y="78" width="480" height="160" rx="14" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="2"/>
    <text x="64" y="114" font-size="16" font-weight="700" fill="#047857">Window open</text>
    <text x="64" y="146" font-size="14" fill="#334155">The customer wrote in the last 24 hours.</text>
    <text x="64" y="174" font-size="14" fill="#334155">Agents can send a normal reply, media,</text>
    <text x="64" y="198" font-size="14" fill="#334155">a quick reply, or a product.</text>
    <rect x="560" y="78" width="500" height="160" rx="14" fill="#FFFFFF" stroke="#FDE68A" stroke-width="2"/>
    <text x="584" y="114" font-size="16" font-weight="700" fill="#B45309">Template only</text>
    <text x="584" y="146" font-size="14" fill="#334155">No inbound message in the last 24 hours.</text>
    <text x="584" y="174" font-size="14" fill="#334155">Meta accepts an approved template.</text>
    <text x="584" y="198" font-size="14" fill="#334155">A customer reply opens the window again.</text>
  </g>
</svg>
