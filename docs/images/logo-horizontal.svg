<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="hIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#128C7E"/>
      <stop offset="50%" stop-color="#075E54"/>
      <stop offset="100%" stop-color="#054640"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="hBorderGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Translucent Sheen -->
    <linearGradient id="hSheen" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Text Gradient for "Desk" -->
    <linearGradient id="hTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#128C7E"/>
      <stop offset="100%" stop-color="#25D366"/>
    </linearGradient>

    <filter id="hShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#043831" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Left: Stylized Icon (Scaled to 72x72) -->
  <g transform="translate(12, 12)">
    <!-- Squircle Base -->
    <rect width="72" height="72" rx="18" fill="url(#hIconBg)" filter="url(#hShadow)"/>
    <rect width="72" height="72" rx="18" fill="none" stroke="url(#hBorderGlow)" stroke-width="1.2"/>
    <path d="M0 20 C0 10 10 0 20 0 L52 0 C62 0 72 10 72 20 L72 36 L0 48 Z" fill="url(#hSheen)" rx="18"/>

    <!-- Depth Echo Bubble -->
    <path d="M42 18 C52 18 60 26 60 36 C60 41 58 45 55 48 L57 56 L49 54 C47 55 44 56 42 56 C32 56 24 48 24 38 C24 28 32 18 42 18 Z"
          fill="#FFFFFF" opacity="0.2"/>

    <!-- Foreground Bubble -->
    <path d="M33 15 C22 15 13 24 13 35 C13 40 15 44 18 47 L15 57 C14.7 58 15.5 58.7 16.3 58.3 L27 54.2 C29 54.8 31 55 33 55 C44 55 53 46 53 35 C53 24 44 15 33 15 Z"
          fill="#FFFFFF"/>

    <!-- Messenger Send Arrow -->
    <path d="M24 34 L43 25 C44.2 24.4 45.4 25.6 44.8 26.8 L36.5 45 C36 46 34.6 46.1 33.9 45.2 L29.5 40.2 L24.3 40.8 C23.3 41 22.8 39.9 23.3 39.1 L26 34 Z"
          fill="#25D366"/>
    <path d="M29.5 40.2 L35 35 L43.5 25.5 L34 45.2 C34.5 43.8 32.8 41.7 29.5 40.2 Z"
          fill="#059669" opacity="0.85"/>

    <!-- Active Indicator -->
    <circle cx="53" cy="20" r="4.5" fill="#128C7E" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="53" cy="20" r="2.5" fill="#25D366"/>
  </g>

  <!-- Right: Typography -->
  <g transform="translate(104, 58)">
    <!-- "Whats" in Frappe dark typography -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="36" font-weight="800" fill="#0F172A" letter-spacing="-0.8">Whats</text>

    <!-- "Desk" in Emerald Brand Gradient -->
    <text x="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="36" font-weight="800" fill="url(#hTextGrad)" letter-spacing="-0.8">Desk</text>

    <!-- Tagline below -->
    <text x="2" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="0.2">
      WhatsApp CRM &amp; Shared Team Inbox
    </text>
  </g>
</svg>
