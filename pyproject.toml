[project]
name = "nudg"
authors = [
    { name = "NUDG Team", email = "hello@mytra.money" }
]
description = "NUDG – Every conversation moves business forward."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<18.0.0"
whatsapp = ">=0.0.1"

[tool.bench.assets]
build_dir = "./frontend"
out_dir = "../nudg/public/frontend"
index_html_path = "../nudg/www/nudg.html"
