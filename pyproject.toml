[project]
name = "nudg"
authors = [
    { name = "Nudg Team", email = "hello@mytra.money" }
]
description = "Nudg – Every conversation moves business forward."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["license.txt"]
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<18.0.0"
whatsapp = ">=0.0.1"

[tool.bench.assets]
build_dir = "./frontend"
out_dir = "../nudg/public/frontend"
index_html_path = "../nudg/www/nudg.html"

[tool.ruff]
line-length = 110
target-version = "py310"
